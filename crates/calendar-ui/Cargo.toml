# SPDX-License-Identifier: GPL-3.0-only
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06), like neoui's apps.
[package]
name = "calendar-ui"
description = "Calendar v2's screens in Slint (no_std): Month, Week, Day, To-do, the event and forms, and what fills them"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
slint = { workspace = true }
calendar-core = { workspace = true }
pim-ics = { workspace = true }

[build-dependencies]
# the neoui kit (@neoui/kit.slint): theme, fonts, glyphs and components
neoui-kit = { workspace = true }

[dev-dependencies]
png = { workspace = true }
