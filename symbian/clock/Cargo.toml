# SPDX-License-Identifier: GPL-3.0-only
# The Clock app (NEOCLOCK.EXE): a separate Symbian process that draws into a surface the UI server gives it. The
# screens are crates/clock-ui; the alarms and the timer live in DTSRV (dt-client).
[package]
name = "neoclock"
description = "NEOCLOCK.EXE: Clock v2 (NeoSymbian/datetime DT2): Clock · Alarms · Timers on DTSRV"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
e32.workspace = true
neoui-proto.workspace = true
datetime-core.workspace = true
dt-client.workspace = true
clock-ui.workspace = true
neoaudio.workspace = true
slint.workspace = true
neoapp.workspace = true
