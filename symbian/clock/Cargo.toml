# The Clock app (NEOCLOCK.EXE): a separate Symbian process that draws into a surface the UI server gives it.
[package]
name = "neoclock"
description = "NEOCLOCK.EXE: the Clock app (NeoSymbian/datetime; moved from neoui in DT0)"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
e32.workspace = true
neoui-proto.workspace = true
datetime-core.workspace = true
slint.workspace = true
neoapp.workspace = true

[build-dependencies]
neoui-kit.workspace = true
